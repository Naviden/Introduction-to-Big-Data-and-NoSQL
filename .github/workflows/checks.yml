name: checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 1 * *"   # once a month, to catch broken external links
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links in the Markdown files
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-retries 3 --exclude kaggle.com --exclude colab.research.google.com './**/*.md'
          fail: true

  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install requirements
        run: pip install -r requirements.txt nbmake pytest
      - name: Run the notebooks
        # The Wikipedia exercise is skipped because it depends on the Wikipedia website
        run: >
          pytest --nbmake --nbmake-timeout=900
          notebooks/redis/redis_intro.ipynb
          notebooks/parquet/columnar_parquet.ipynb
          notebooks/spark/salary_analysis_functions.ipynb
          notebooks/spark/session_data_practice.ipynb
          case-studies/retail/retail_case_study.ipynb
          case-studies/key-value/key_value_databases_case_study.ipynb
